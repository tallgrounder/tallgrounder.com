<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tallgrounder</title>
  <meta name="description" content="Tallgrounder — solo dev in Estonia. Working on my first game." />
  <link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
  <link rel="shortcut icon" href="/favicon/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="Tallgrounder" />
  <link rel="manifest" href="/favicon/site.webmanifest" />

  <style>
    :root {
      --bg: #0d0d0d;
      --bg-soft: #161616;
      --text: #ffffff;
      --muted: #8c8c8c;
      --accent: #ff2222;
      --font-logo: "Barlow Condensed", "Arial Narrow", sans-serif;
      --font-ui: "Archivo Narrow", "Helvetica Neue", sans-serif;
    }

    @font-face {
      font-family: 'Archivo Narrow';
      src: url('fonts/Archivo_Narrow/static/ArchivoNarrow-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: 'Archivo Narrow';
      src: url('fonts/Archivo_Narrow/static/ArchivoNarrow-Medium.ttf') format('truetype');
      font-weight: 500;
      font-style: normal;
    }
    @font-face {
      font-family: 'Archivo Narrow';
      src: url('fonts/Archivo_Narrow/static/ArchivoNarrow-SemiBold.ttf') format('truetype');
      font-weight: 600;
      font-style: normal;
    }

    @font-face {
      font-family: 'Barlow Condensed';
      src: url('fonts/Barlow_Condensed/BarlowCondensed-Medium.ttf') format('truetype');
      font-weight: 500;
      font-style: normal;
    }
    @font-face {
      font-family: 'Barlow Condensed';
      src: url('fonts/Barlow_Condensed/BarlowCondensed-SemiBold.ttf') format('truetype');
      font-weight: 600;
      font-style: normal;
    }
    @font-face {
      font-family: 'Barlow Condensed';
      src: url('fonts/Barlow_Condensed/BarlowCondensed-Bold.ttf') format('truetype');
      font-weight: 700;
      font-style: normal;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(1100px 620px at 50% 26%, var(--bg-soft) 0%, var(--bg) 62%),
        var(--bg);
      color: var(--text);
      font-family: var(--font-ui);
      -webkit-font-smoothing: antialiased;
    }

    .hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: clamp(1.25rem, 4vh, 2.5rem);
      padding: clamp(2rem, 6vh, 4rem) 1.5rem;
    }

    .eyebrow {
      text-transform: uppercase;
      letter-spacing: 0.42em;
      font-size: 0.72rem;
      color: var(--muted);
      padding-left: 0.42em;
    }

    /* Logo + heading row */
    .brand-row {
      display: flex;
      align-items: center;
      gap: clamp(1rem, 3vw, 2rem);
    }

    .brand-logo {
      width: clamp(80px, 12vw, 160px);
      height: auto;
      aspect-ratio: 400 / 321;
      object-fit: contain;
    }   

    .logo {
      font-family: var(--font-logo);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-size: clamp(3rem, 13vw, 8.5rem);
      line-height: 0.95;
      color: var(--text);
    }

    .tagline {
      font-family: var(--font-logo);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.28em;
      font-size: clamp(0.95rem, 3vw, 1.3rem);
      color: var(--text);
    }

    .socials {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.9rem 1.75rem;
      margin-top: clamp(0.5rem, 2vh, 1.25rem);
    }

    .social {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .social:hover,
    .social:focus-visible { color: var(--accent); outline: none; }

    footer {
      padding: 1.5rem;
      text-align: center;
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      color: var(--muted);
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    @media (max-width: 480px) {
      .socials { gap: 0.6rem 1.1rem; }
      .eyebrow { letter-spacing: 0.3em; }
      .brand-row { flex-direction: column; gap: 0.75rem; }
      .brand-logo { width: clamp(64px, 20vw, 100px); }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }

    @media (max-width: 480px) {
      .socials { gap: 0.6rem 1.1rem; }
      .eyebrow {
        letter-spacing: 0.3em;
        font-size: 0.62rem;
      }
      .logo {
        font-size: clamp(2rem, 14vw, 3.2rem);
      }
      .tagline {
        font-size: clamp(0.75rem, 3.5vw, 1rem);
        letter-spacing: 0.2em;
      }
      .brand-row { flex-direction: column; gap: 0.75rem; }
      .brand-logo { width: clamp(64px, 22vw, 100px); }
      .social { font-size: 0.68rem; }
    }
  </style>
</head>
<body>
  <main class="hero">
    <p class="eyebrow">Solo dev in Estonia</p>

    <div class="brand-row">
      <img
        class="brand-logo"
        src="img/logo.png"
        alt="Tallgrounder logo"
        width="400"
        height="321"
        loading="eager"
      />
      <h1 class="logo">TALLGROUNDER</h1>
    </div>

    <p class="tagline">Working on my first game</p>

    <nav class="socials" aria-label="Social media">
      <a class="social" href="https://tallgrounder.itch.io/" aria-label="itch.io — Tallgrounder">itch.io</a>
      <a class="social" href="https://tiktok.com/@tallgrounder" aria-label="TikTok — @tallgrounder">TikTok</a>
      <a class="social" href="https://instagram.com/tall.grounder" aria-label="Instagram — @tall.grounder">Instagram</a>
      <a class="social" href="https://bsky.app/profile/tallgrounder.bsky.social" aria-label="Bluesky — @tallgrounder.bsky.social">Bluesky</a>
      <a class="social" href="https://x.com/tallgrounder" aria-label="X — @tallgrounder">X</a>
      <a class="social" href="https://discord.gg/ZPhbAn7u8" aria-label="Discord — join server">Discord</a>
      <a class="social" href="https://youtube.com/@tallgrounder" aria-label="YouTube — @tallgrounder">YouTube</a>
    </nav>
  </main>

  <footer>
    <span>&copy; <span id="year"></span> Tallgrounder. All rights reserved.</span>
  </footer>

  <script>
    const y = new Date().getFullYear();
    document.getElementById('year').textContent = y === 2026 ? '2026' : `2026 – ${y}`;
  </script>
</body>
</html>
