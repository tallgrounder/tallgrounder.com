<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tallgrounder</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f0f;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    h1 {
      font-size: 3rem;
      color: #fff;
      margin-bottom: 0.5rem;
    }
    .tagline {
      color: #888;
      font-size: 1.1rem;
      margin-bottom: 3rem;
    }
    .socials {
      display: flex;
      gap: 1.5rem;
    }
    .socials a {
      color: #888;
      text-decoration: none;
      font-size: 0.9rem;
    }
    .socials a:hover {
      color: #fff;
    }
  </style>
</head>
<body>
  <h1>Tallgrounder</h1>
  <p class="tagline">Comming soon</p>
</body>
</html>
